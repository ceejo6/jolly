services:
  rails:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: jolly_rails
    restart: unless-stopped
    ports:
      - "${RAILS_PORT}:3000"
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - SOLID_QUEUE_IN_PUMA=true
      - PORT=3000
    volumes:
      - ./data/rails/storage:/rails/storage
    networks:
      jolly_network:
        aliases:
          - rails
    deploy:
      resources:
        limits:
          memory: 1024M

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jolly_jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT}:8096"
      - "${JELLYFIN_DISCOVERY_PORT}:7359/udp"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/media:/media
    networks:
      jolly_network:
        aliases:
          - jellyfin
    deploy:
      resources:
        limits:
          memory: 2048M

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jolly_tunnel
    restart: "no"
    command: version
    networks:
      - jolly_network
    deploy:
      resources:
        limits:
          memory: 256M

  tailscale:
    image: tailscale/tailscale:stable
    container_name: jolly_tailscale
    hostname: ${TAILSCALE_HOSTNAME}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    volumes:
      - ./data/tailscale:/var/lib/tailscale
    networks:
      - jolly_network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  jolly_network:
    name: jolly_network
    driver: bridge
